<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VERDIS-PCF — 제품 탄소발자국 플랫폼</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      background: linear-gradient(135deg, #064e3b 0%, #0f766e 40%, #059669 100%);
      color: white; font-family: system-ui, sans-serif; transition: opacity 0.5s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #34d399; border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top:16px;font-size:14px;opacity:0.7">VERDIS-PCF 로딩 중...</p>
  </div>
  <iframe id="app" allowfullscreen allow="clipboard-read; clipboard-write"></iframe>
  <script>
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCRDYYkb74lJ7kbuYjJ0qrH25dG36PtmvWLdZpzJw4uX-L4oB9kph3LwvrBbwnDv8O/exec';
    var iframe = document.getElementById('app');
    iframe.src = APPS_SCRIPT_URL + '?page=home';
    iframe.addEventListener('load', function () {
      var ld = document.getElementById('loading');
      if (ld) { ld.classList.add('done'); setTimeout(function(){ ld.remove(); }, 600); }
    });
  </script>
</body>
</html>
