<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VERDIS Platform</title>
  <style>
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(135deg,#0f172a,#1e3a5f);font-family:'Segoe UI',sans-serif;color:#fff}
    .card{text-align:center;padding:48px;border-radius:20px;background:rgba(255,255,255,.06);
          backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
    .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.15);
             border-top-color:#22d3ee;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
    @keyframes spin{to{transform:rotate(360deg)}}

    #app-frame{
      display:none;
      position:fixed;
      top:0;left:0;
      width:100%;height:100%;
      border:none;
      z-index:9999;
    }

    #fallback{display:none;margin-top:20px;font-size:14px}
    #fallback a{
      display:inline-block;
      margin-top:12px;
      padding:14px 28px;
      border-radius:10px;
      background:#22d3ee;
      color:#0f172a;
      font-size:16px;
      font-weight:700;
      text-decoration:none;
    }
  </style>
</head>
<body>

  <!-- 로딩 카드 -->
  <div class="card" id="loading-card">
    <div class="spinner"></div>
    <h2>🌿 VERDIS Platform</h2>
    <p>플랫폼에 접속 중입니다...</p>
    <!-- iframe이 뜨지 않을 때 직접 접속 (Safari 쿠키 차단 등) -->
    <div id="fallback">
      <div>화면이 열리지 않으면 아래 버튼을 눌러 주세요.</div>
      <a id="fallback-link">포털 바로 열기</a>
    </div>
  </div>

  <!-- iframe -->
  <iframe
    id="app-frame"
    src="https://script.google.com/a/macros/interwell.co.kr/s/AKfycbwFXxxaa7syLrH-rBerG_1LalB3igKc6o7nq-tqnJ9fU9ydMrnRnlvy5PTjzvaazwiPVw/exec"
    allowfullscreen
    allow="clipboard-read; clipboard-write">
  </iframe>

  <script>
    var frame = document.getElementById('app-frame');
    var fallback = document.getElementById('fallback');
    document.getElementById('fallback-link').href = frame.src;
    var fallbackTimer = setTimeout(function(){ fallback.style.display = 'block'; }, 8000);
    frame.addEventListener('load', function(){
      clearTimeout(fallbackTimer);
      document.getElementById('loading-card').style.display = 'none';
      frame.style.display = 'block';
    });
  </script>

</body>
</html>
