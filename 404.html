<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VERDIS-PCF</title>
  <script>
    // GitHub Pages SPA 라우팅 — 모든 경로를 index.html로 리다이렉트
    // 경로와 쿼리스트링을 보존하여 index.html에서 올바른 페이지 로드
    var path = location.pathname;
    var search = location.search;
    var hash = location.hash;
    // sessionStorage에 원래 경로 저장 후 루트로 리다이렉트
    sessionStorage.setItem('pcf_redirect', path + search + hash);
    location.replace('/pcf/');
  </script>
</head>
<body>
  <p style="font-family:system-ui;padding:40px;color:#64748b">리다이렉트 중...</p>
</body>
</html>
